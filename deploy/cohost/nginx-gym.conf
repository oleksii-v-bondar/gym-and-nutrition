# nginx server block for the gym app, co-hosted behind your existing nginx.
#
# Mount this into the existing nginx container (see COHOSTING.md), e.g. add to
# that container's volumes:
#   - /opt/gym-tracker/deploy/cohost/nginx-gym.conf:/etc/nginx/conf.d/gym.conf:ro
# and connect the nginx container to the shared "edge" network so "gym" resolves.
#
# The gym's internal Caddy already splits /api vs. static files, so we forward
# everything to it.

server {
    listen 80;
    server_name gym-and-nutrition.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gym-and-nutrition.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/gym-and-nutrition.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gym-and-nutrition.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://gym:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
