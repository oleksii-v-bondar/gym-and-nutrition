# Co-hosting stack: run the gym app on an EXISTING VM alongside another app.
#
# It does NOT bind host ports 80/443 (your existing nginx owns those). Instead
# the internal Caddy joins a shared external Docker network ("edge") with the
# alias "gym", and your existing nginx reverse-proxies the gym domain to it.
#
# Project name is pinned to "gym-tracker" so containers/volumes/networks never
# collide with the other app on the box.
#
# Run from the deploy/ directory:
#   docker network create edge   # once, ignore "already exists"
#   docker compose -f docker-compose.cohost.yml --env-file cohost/.env up -d --build
#
# See COHOSTING.md for the full runbook (DuckDNS, certbot, nginx wiring).

name: gym-tracker

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-ascererak}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web-build:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    volumes:
      - webroot:/srv

  # Internal app router: serves the SPA and proxies /api -> api:3000.
  # Plain HTTP on :80 inside the container (SITE_ADDRESS=:80). TLS is terminated
  # by the existing host nginx, which proxies to this via the "edge" network.
  caddy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - webroot:/srv
      - caddydata:/data
    depends_on:
      - api
      - web-build
    networks:
      default: {}
      edge:
        aliases:
          - gym
    restart: unless-stopped

networks:
  # Shared with the existing app's nginx so it can reach "gym" by name.
  edge:
    external: true

volumes:
  dbdata:
  webroot:
  caddydata:
